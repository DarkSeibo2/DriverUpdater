name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Тесты (xUnit)
        run: dotnet test DriverUpdater.sln -c Release --nologo

      # Portable-сборка: single-file exe + нативные DLL WPF, всё self-contained.
      # Настройки публикуемого проекта заданы в DriverUpdater.csproj.
      - name: Сборка portable-версии
        run: dotnet publish DriverUpdater/DriverUpdater.csproj -c Release -r win-x64 -o publish

      - name: Архив
        run: Compress-Archive -Path publish/* -DestinationPath "DriverUpdater-portable-build-${{ github.run_number }}.zip"

      - name: Загрузка в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          generate_release_notes: true
          files: DriverUpdater-portable-build-${{ github.run_number }}.zip
