name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to commit SHAs: a moved tag cannot change what runs
      # with a write-scoped token in this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      # Single source of truth for the version is DriverUpdater.csproj.
      - name: Версия
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content DriverUpdater/DriverUpdater.csproj
          $version = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } |
            Select-Object -First 1).Version
          if (-not $version) { throw "Version not found in DriverUpdater.csproj" }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Project version: $version"

      - name: Тесты (xUnit)
        run: dotnet test DriverUpdater.sln -c Release --nologo

      # Portable-сборка: single-file exe + нативные DLL WPF, всё self-contained.
      # Настройки публикуемого проекта заданы в DriverUpdater.csproj.
      - name: Сборка portable-версии
        run: >
          dotnet publish DriverUpdater/DriverUpdater.csproj -c Release -r win-x64 -o publish
          -p:InformationalVersion=${{ steps.version.outputs.value }}-build-${{ github.run_number }}

      - name: Архив
        run: Compress-Archive -Path publish/* -DestinationPath "DriverUpdater-portable-build-${{ github.run_number }}.zip"

      # Проверочная сумма архива прикладывается к релизу: получатель может
      # сверить скачанный файл до запуска
      - name: SHA-256
        run: |
          $zip = "DriverUpdater-portable-build-${{ github.run_number }}.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          Get-Content "$zip.sha256"

      - name: Загрузка в Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          generate_release_notes: true
          files: |
            DriverUpdater-portable-build-${{ github.run_number }}.zip
            DriverUpdater-portable-build-${{ github.run_number }}.zip.sha256
